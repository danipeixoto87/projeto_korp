- name: Provisionar Projeto Korp
  hosts: local
  become: true

  vars:
    project_dir: /opt/http-server-projeto-korp
    repository: https://github.com/danipeixoto87/projeto_korp.git

  tasks:

    - name: Instalar Git
      ansible.builtin.package:
        name: git
        state: present

    - name: Instalar dependências para repositório Docker - RedHat
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Configurar repositório Docker - RHEL
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/rhel/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['distribution'] == "RedHat"

    - name: Configurar repositório Docker - CentOS compatible
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['distribution'] in ["Rocky", "AlmaLinux", "CentOS"]

    - name: Configurar repositório Docker - Fedora
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/fedora/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"
      when:
        - ansible_facts['os_family'] == "RedHat"
        - ansible_facts['distribution'] == "Fedora"

    - name: Instalar dependências para repositório Docker - Debian
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Criar diretório de keyrings do APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_facts['os_family'] == "Debian"

    - name: Adicionar chave GPG do Docker - Debian
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: ansible_facts['os_family'] == "Debian"

    - name: Obter arquitetura APT
      ansible.builtin.command:
        cmd: dpkg --print-architecture
      register: apt_architecture
      changed_when: false
      when: ansible_facts['os_family'] == "Debian"

    - name: Configurar repositório Docker - Debian/Ubuntu
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ apt_architecture.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ 'ubuntu' if ansible_facts['distribution'] == 'Ubuntu' else 'debian' }}
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Instalar Docker - RedHat
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    - name: Instalar Docker - Debian
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Garantir que o Docker esteja iniciado
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Verificar versão do Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Exibir versão do Docker
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Verificar versão do Docker Compose
      ansible.builtin.command:
        cmd: docker compose version
      register: docker_compose_version
      changed_when: false

    - name: Exibir versão do Docker Compose
      ansible.builtin.debug:
        var: docker_compose_version.stdout

    - name: Clonar projeto Korp
      ansible.builtin.git:
        repo: "{{ repository }}"
        dest: "{{ project_dir }}"
        version: master
        update: true

    - name: Criar rede Docker korp-network
      ansible.builtin.command:
        cmd: docker network create --driver bridge korp-network
      register: network_create
      failed_when:
        - network_create.rc != 0
        - "'already exists' not in network_create.stderr"
      changed_when: network_create.rc == 0

    - name: Subir ambiente com Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}"

    - name: Validar serviço Projeto Korp
      ansible.builtin.uri:
        url: http://localhost/projeto-korp
        method: GET
        status_code: 200
        return_content: true
      register: projeto_korp_response

    - name: Exibir resposta do Projeto Korp
      ansible.builtin.debug:
        msg: "{{ projeto_korp_response.content }}"
