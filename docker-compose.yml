services:

  http-server-projeto-korp:
    build:
      context: ./app

    container_name: http-server-projeto-korp

    restart: unless-stopped

    expose:
      - "8080"

    networks:
      - korp-network

  nginx:
    image: nginx:alpine

    container_name: nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - http-server-projeto-korp

    networks:
      - korp-network

  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - http-server-projeto-korp

    networks:
      - korp-network

  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    depends_on:
      - prometheus

    networks:
      - korp-network

networks:

  korp-network:
    driver: bridge
