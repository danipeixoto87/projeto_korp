services:

  http-server-projeto-korp:
    build:
      context: ./app

    container_name: http-server-projeto-korp

    restart: unless-stopped

    expose:
      - "8080"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - korp-network

  nginx:
    image: nginx:1.31.3-alpine

    container_name: nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      http-server-projeto-korp:
        condition: service_healthy

    networks:
      - korp-network

  prometheus:
    image: prom/prometheus:v3.13.1

    container_name: prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      http-server-projeto-korp:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - korp-network

  grafana:
    image: grafana/grafana:13.1

    container_name: grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      prometheus:
        condition: service_healthy

    networks:
      - korp-network

networks:

  korp-network:
    external: true
    name: korp-network
